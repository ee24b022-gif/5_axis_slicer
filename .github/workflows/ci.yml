name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: slicer_test
          POSTGRES_PASSWORD: slicer_password
          POSTGRES_DB: slicer_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_TEST_URL: postgresql+psycopg://slicer_test:slicer_password@localhost:5432/slicer_test_db
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: testing
      AUTH_MODE: none
      VITE_API_BASE_URL: http://localhost:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies (Postgres)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev gcc

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests (Pytest)
        working-directory: ./backend
        run: |
          pytest tests/ --cov=./ --cov-report=xml -v

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Frontend Tests (Vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Build Frontend Artifacts
        working-directory: ./frontend
        run: npm run build
