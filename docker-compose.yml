# Dev stack: Postgres + API (in-process jobs, APP_ENV=development) + frontend.
# Artifacts are stored on a local volume (MinIO images were withdrawn from Docker Hub in Sept 2026).
# For Celery: set APP_ENV=production in .env.docker and add redis + worker services.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: slicer_user
      POSTGRES_PASSWORD: slicer_password
      POSTGRES_DB: slicer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slicer_user -d slicer_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["api"]
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - artifacts:/data/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  pgdata:
  artifacts:
