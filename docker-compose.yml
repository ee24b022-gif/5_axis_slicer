version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: slicer_test
      POSTGRES_PASSWORD: slicer_password
      POSTGRES_DB: slicer_test_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slicer_test -d slicer_test_db"]
      interval: 2s
      timeout: 5s
      retries: 5
